# Isolated offline CSV-mapping business demo. Does not launch Qdrant or LLM.
# Source files must be placed under data/csv_mappings/ (gitignored).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_tender_csv_demo}
      POSTGRES_USER: ${POSTGRES_USER:-rag_tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_tender}
    volumes:
      - csv_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.csv-demo
    env_file: .env
    environment:
      APP_ENV: production
      MATCH_BACKEND: csv_mapping
      CSV_MAPPING_DIR: /data/csv_mappings
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag_tender}:${POSTGRES_PASSWORD:-rag_tender}@postgres:5432/${POSTGRES_DB:-rag_tender_csv_demo}
    volumes:
      - ./data/csv_mappings:/data/csv_mappings:ro
    ports:
      - "127.0.0.1:${CSV_DEMO_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  csv_demo_postgres:
